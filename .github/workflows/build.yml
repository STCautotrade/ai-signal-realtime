name: Build APK Stable

on:
  push:
    branches:
      - main

# 🔥 WAJIB: FIX ERROR 403 RELEASE
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ======================
      # CHECKOUT SOURCE CODE
      # ======================
      - name: Checkout repo
        uses: actions/checkout@v4

      # ======================
      # SETUP PYTHON
      # ======================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ======================
      # SETUP JAVA
      # ======================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ======================
      # SYSTEM DEPENDENCIES
      # ======================
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          git zip unzip wget curl \
          build-essential python3-pip \
          openjdk-17-jdk autoconf libtool pkg-config \
          libffi-dev libssl-dev ccache

      # ======================
      # PYTHON DEPENDENCIES
      # ======================
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33

      # ======================
      # CLEAN PROJECT
      # ======================
      - name: Clean build folder
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ======================
      # BUILD APK (BUILD OLEH BUILDOZER)
      # ======================
      - name: Build APK
        run: |
          buildozer -v android debug

      # ======================
      # UPLOAD APK ARTIFACT
      # ======================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk

      # ======================
      # CREATE GITHUB RELEASE
      # ======================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Signal Release v1.0.${{ github.run_number }}
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
