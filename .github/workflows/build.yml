name: Build APK Stable

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # INSTALL SYSTEM DEPENDENCIES
      # =========================
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          git zip unzip wget curl \
          build-essential python3-pip \
          openjdk-17-jdk autoconf libtool pkg-config \
          libffi-dev libssl-dev ccache

      # =========================
      # INSTALL PYTHON TOOLS
      # =========================
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33

      # =========================
      # 🔥 FIX ANDROID SDK (ANTI ERROR 37)
      # =========================
      - name: Install Android SDK stable
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip

          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true

          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin

          # accept all licenses (FIX ERROR LICENSE)
          yes | sdkmanager --licenses || true

          # install stable versions ONLY
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"
          sdkmanager "ndk;25.2.9519653"

      # =========================
      # CLEAN BUILD
      # =========================
      - name: Clean build
        run: |
          rm -rf .buildozer
          rm -rf bin

      # =========================
      # BUILD APK
      # =========================
      - name: Build APK
        run: |
          buildozer -v android debug

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk

      # =========================
      # AUTO RELEASE APK
      # =========================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Signal Release v1.0.${{ github.run_number }}
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
